org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Reuse the build configuration between runs, and outputs whose inputs haven't changed.
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
# AGP 9 turned on R8's strict full mode, where a library rule like "-keep class X" keeps the class
# but not its constructor. Library rules are written for the old meaning: ML Kit's component
# registrars lost their constructors, and the barcode/porch scanner crashed on opening, which also
# took the morning alarm down with it (release 128). Off restores how rules read under AGP 8.
android.r8.strictFullModeForKeepRules=false
