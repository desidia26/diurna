# AI prompt evals. Default PR/push path: GitHub Models smoke (no repo secrets).
# Real Grok/Claude runs need XAI_API_KEY / ANTHROPIC_API_KEY (admin-only secrets) via
# workflow_dispatch, or when those secrets are present on a path-filtered run.
# Never pull_request_target. Not a required check.
name: AI evals

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "grok | claude | github-models | all"
        required: true
        default: "all"
        type: choice
        options: [grok, claude, github-models, all]
      set:
        description: "Case set"
        required: true
        default: "default"
        type: choice
        options: [smoke, default, full]
      grokModel:
        description: "xAI model override (blank = app default)"
        required: false
        default: ""
        type: string
      claudeModel:
        description: "Anthropic model override (blank = app default)"
        required: false
        default: ""
        type: string
      githubModel:
        description: "GitHub Models id (blank = xai/grok-3-mini)"
        required: false
        default: ""
        type: string
  pull_request:
    paths:
      - "app/src/main/java/app/diurna/ai/**"
      - "app/src/aiEval/**"
      - "app/src/test/java/app/diurna/eval/**"
      - "app/build.gradle.kts"
      - "ai-evals/**"
      - "docs/ai-evals.md"
      - ".github/workflows/ai-evals.yml"
  push:
    branches: [main]
    paths:
      - "app/src/main/java/app/diurna/ai/**"
      - "app/src/aiEval/**"
      - "app/src/test/java/app/diurna/eval/**"
      - "app/build.gradle.kts"
      - "ai-evals/**"
      - "docs/ai-evals.md"
      - ".github/workflows/ai-evals.yml"

concurrency:
  group: ai-evals-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# models: read lets GITHUB_TOKEN call GitHub Models when that service is available.
# contents: read is enough for checkout. No broader permissions.
permissions:
  contents: read
  models: read

jobs:
  eval:
    name: Prompt evals
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Choose provider and case set
        id: pick
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "provider=${{ inputs.provider }}" >> "$GITHUB_OUTPUT"
            echo "set=${{ inputs.set }}" >> "$GITHUB_OUTPUT"
            echo "grokModel=${{ inputs.grokModel }}" >> "$GITHUB_OUTPUT"
            echo "claudeModel=${{ inputs.claudeModel }}" >> "$GITHUB_OUTPUT"
            echo "githubModel=${{ inputs.githubModel }}" >> "$GITHUB_OUTPUT"
          else
            # Path-filtered PR/push: smoke on GitHub Models (no secrets). If real keys
            # exist, also run the default set against those providers.
            HAS_XAI=0
            HAS_ANT=0
            if [ -n "${XAI_API_KEY:-}" ]; then HAS_XAI=1; fi
            if [ -n "${ANTHROPIC_API_KEY:-}" ]; then HAS_ANT=1; fi
            if [ "$HAS_XAI$HAS_ANT" = "11" ]; then
              echo "provider=all" >> "$GITHUB_OUTPUT"
              echo "set=default" >> "$GITHUB_OUTPUT"
            elif [ "$HAS_XAI" = "1" ]; then
              echo "provider=grok" >> "$GITHUB_OUTPUT"
              echo "set=default" >> "$GITHUB_OUTPUT"
            elif [ "$HAS_ANT" = "1" ]; then
              echo "provider=claude" >> "$GITHUB_OUTPUT"
              echo "set=default" >> "$GITHUB_OUTPUT"
            else
              echo "provider=github-models" >> "$GITHUB_OUTPUT"
              echo "set=smoke" >> "$GITHUB_OUTPUT"
            fi
            echo "grokModel=" >> "$GITHUB_OUTPUT"
            echo "claudeModel=" >> "$GITHUB_OUTPUT"
            echo "githubModel=" >> "$GITHUB_OUTPUT"
          fi
        env:
          # Presence check only; values are not printed.
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run AI evals
        # Secrets only on this step. GITHUB_TOKEN is the job token (models: read).
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ARGS="-Pprovider=${{ steps.pick.outputs.provider }} -Pset=${{ steps.pick.outputs.set }}"
          if [ -n "${{ steps.pick.outputs.grokModel }}" ]; then
            ARGS="$ARGS -PgrokModel=${{ steps.pick.outputs.grokModel }}"
          fi
          if [ -n "${{ steps.pick.outputs.claudeModel }}" ]; then
            ARGS="$ARGS -PclaudeModel=${{ steps.pick.outputs.claudeModel }}"
          fi
          if [ -n "${{ steps.pick.outputs.githubModel }}" ]; then
            ARGS="$ARGS -PgithubModel=${{ steps.pick.outputs.githubModel }}"
          fi
          # shellcheck disable=SC2086
          ./gradlew aiEval $ARGS

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-eval-results
          path: ai-evals/out/
          if-no-files-found: warn
