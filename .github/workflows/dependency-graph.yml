# Sends the fully resolved dependency tree to GitHub on every push to main. Without it, Dependabot
# reads only the version catalog and build files, so a CVE in a transitive dependency (OkHttp or
# Jackson under anthropic-java, say) never raises an alert.
name: Dependency graph

on:
  push:
    branches: [main]

# Actions are pinned to full commit SHAs (release tag in the comment), so a moved or
# compromised tag can't change what runs here. Bump the SHA and the comment together.
# Write is scoped to the submit job only; Dependabot itself needs no workflow permissions.
permissions:
  contents: read

jobs:
  submit:
    name: Submit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
