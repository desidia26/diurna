# Publishes a signed release build from main once a day, as a normal GitHub release that
# Obtainium installs and updates. Skips when there's nothing new or main's tests didn't pass.
#
# Signed with the release key from the "release" environment (deployable from main only; created
# by scripts/new-release-key). Every build's certificate is checked against RELEASE_CERT_SHA256
# before it's published, so a wrong or missing key never reaches anyone's phone.
name: Nightly

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

# Actions are pinned to full commit SHAs (release tag in the comment), as in tests.yml.
permissions:
  contents: read

jobs:
  publish:
    name: Publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write # create the release and its tag
      actions: read # see whether Tests passed on this commit
    env:
      GH_TOKEN: ${{ github.token }}
      # Release APKs are about 26.5 MB; a jump past this is a dependency to look at, not ship.
      MAX_APK_BYTES: 31457280
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # versionCode is the commit count, so the build needs the full history.
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether to publish
        id: version
        run: |
          n="$(git rev-list --count HEAD)"
          tag="v0.$n"
          echo "n=$n" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "$tag is already published; nothing new on main." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tests="$(gh run list --workflow tests.yml --commit "$GITHUB_SHA" --event push \
            --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')"
          if [[ "$tests" == 0 ]]; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "Tests haven't passed on $GITHUB_SHA; not publishing $tag." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "skip=false" >>"$GITHUB_OUTPUT"

      - if: steps.version.outputs.skip == 'false'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - if: steps.version.outputs.skip == 'false'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Same layout as on the release machine: app/build.gradle.kts reads signing/keystore.properties.
      - name: Write the signing key
        if: steps.version.outputs.skip == 'false'
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          umask 077
          mkdir -p signing
          printf '%s' "$KEYSTORE_B64" | base64 -d >signing/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } >signing/keystore.properties

      - name: Build
        if: steps.version.outputs.skip == 'false'
        run: ./gradlew assembleRelease

      - name: Check the APK
        if: steps.version.outputs.skip == 'false'
        env:
          EXPECTED_CERT: ${{ vars.RELEASE_CERT_SHA256 }}
          N: ${{ steps.version.outputs.n }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          [[ -n "$EXPECTED_CERT" ]] || { echo "RELEASE_CERT_SHA256 isn't set"; exit 1; }
          cert="$("$tools/apksigner" verify --print-certs "$apk" | awk '/SHA-256 digest/ && !n++ {print $NF}')"
          [[ "$cert" == "$EXPECTED_CERT" ]] || { echo "signed with $cert, expected $EXPECTED_CERT"; exit 1; }
          badging="$("$tools/aapt2" dump badging "$apk")"
          grep -q "package: name='app.daybook' versionCode='$N' versionName='0.$N'" <<<"$badging" \
            || { echo "unexpected package or version:"; head -1 <<<"$badging"; exit 1; }
          size="$(stat -c %s "$apk")"
          (( size <= MAX_APK_BYTES )) || { echo "APK is $size bytes, over the $MAX_APK_BYTES limit"; exit 1; }
          cp "$apk" "diurna-0.$N.apk"
          echo "0.$N: $((size / 1048576)) MB, certificate $cert" >>"$GITHUB_STEP_SUMMARY"

      - name: Publish
        if: steps.version.outputs.skip == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          N: ${{ steps.version.outputs.n }}
        run: |
          gh release create "$TAG" "diurna-0.$N.apk" --target "$GITHUB_SHA" \
            --title "Diurna 0.$N" --generate-notes
          # Keep the newest 15 builds; Obtainium only needs the latest.
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("v0."))] | sort_by(.createdAt) | reverse | .[15:] | .[].tagName' \
            | while read -r old; do gh release delete "$old" --cleanup-tag --yes; done

      - name: Remove the signing key
        if: always()
        run: rm -rf signing
