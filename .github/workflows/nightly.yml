# Publishes a signed release build from main once a day, as a normal GitHub release that
# Obtainium installs and updates. Skips when there's nothing new or main's tests didn't pass.
#
# Before publishing, the same minified build runs on an emulator and the morning alarm is made to
# go off (scripts/smoke): debug builds and unit/device tests never run R8's output, and release
# 128 shipped an alarm that crashed on opening. Signed with the release key from the "release"
# environment (deployable from main only; created by scripts/new-release-key), and every build's
# certificate is checked against RELEASE_CERT_SHA256, so a wrong key never reaches anyone's phone.
#
# Security, before anything is signed: high/critical advisories in what ships (scripts/security-gate,
# today's OSV data) or open high/critical CodeQL alerts block the night, and the autofix job asks
# Claude for a fix PR. Claude also reviews everything since the last release; a finding sends the
# night's publish to the release-held environment, which waits for a person. AI can hold a release
# or propose a fix, never clear one. scripts/check-apk fails on a new permission or exported component.
name: Nightly

on:
  schedule:
    # 04:00 UTC is midnight Eastern: well away from morning alarms, so an update never lands as
    # one is about to ring.
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

# Actions are pinned to full commit SHAs (release tag in the comment), as in tests.yml.
permissions:
  contents: read

jobs:
  check:
    name: Anything to publish?
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # see whether Tests passed on this commit
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      n: ${{ steps.version.outputs.n }}
      tag: ${{ steps.version.outputs.tag }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # versionCode is the commit count, so the build needs the full history.
          fetch-depth: 0
          persist-credentials: false
      - id: version
        run: |
          n="$(git rev-list --count HEAD)"
          tag="v0.$n"
          echo "n=$n" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "$tag is already published; nothing new on main." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tests="$(gh run list --workflow tests.yml --commit "$GITHUB_SHA" --event push \
            --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')"
          if [[ "$tests" == 0 ]]; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "Tests haven't passed on $GITHUB_SHA; not publishing $tag." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "skip=false" >>"$GITHUB_OUTPUT"

  security:
    name: Security
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Main-only environment: holds CLAUDE_AUTOFIX_KEY, which pull request code can never read.
    environment: security
    permissions:
      contents: read
      security-events: read # open CodeQL alerts on this commit
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      blocked: ${{ steps.verdict.outputs.blocked }}
      hold: ${{ steps.verdict.outputs.hold }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Known vulnerabilities (what ships)
        id: cve
        continue-on-error: true
        run: scripts/security-gate

      - name: Open CodeQL alerts
        id: codeql
        run: |
          if ! alerts="$(gh api "repos/$GITHUB_REPOSITORY/code-scanning/alerts?ref=refs/heads/main&state=open&tool_name=CodeQL&per_page=100" --paginate 2>codeql.err)"; then
            # Only "no analysis yet" (404) passes; any other failure blocks rather than reading as zero alerts.
            if grep -q 'HTTP 404' codeql.err; then
              echo "No CodeQL analysis on main yet; nothing to check." >>"$GITHUB_STEP_SUMMARY"
              echo "high=0" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            echo "### CodeQL: couldn't read the alerts ($(head -c 300 codeql.err)); blocking" >>"$GITHUB_STEP_SUMMARY"
            echo "high=unknown" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Kept for the autofix job: where each high/critical alert is and which rule it broke.
          jq -s '[.[][] | select(.rule.security_severity_level == "high" or .rule.security_severity_level == "critical")
            | {rule: .rule.id, severity: .rule.security_severity_level, path: .most_recent_instance.location.path,
               line: .most_recent_instance.location.start_line}]' <<<"$alerts" >codeql.json
          high="$(jq length codeql.json)"
          echo "high=$high" >>"$GITHUB_OUTPUT"
          echo "### CodeQL: $high open high/critical alert(s) on main" >>"$GITHUB_STEP_SUMMARY"

      - name: AI review of everything since the last release
        id: ai
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_AUTOFIX_KEY }}
        run: |
          if [[ -z "$ANTHROPIC_API_KEY" ]]; then
            echo "### AI review: skipped (CLAUDE_AUTOFIX_KEY isn't set in the security environment)" >>"$GITHUB_STEP_SUMMARY"
            echo "verdict=skipped" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          prev="$(gh release list --limit 50 --json tagName --jq '[.[] | select(.tagName | startswith("v0."))][0].tagName // ""')"
          if [[ -n "$prev" ]] && git rev-parse -q --verify "refs/tags/$prev" >/dev/null; then base="$prev"; else base="HEAD~20"; fi
          scripts/ai-review "$base" HEAD review.json
          python3 -I scripts/ai-review-comment.py review.json >>"$GITHUB_STEP_SUMMARY"
          echo "verdict=$(jq -r .verdict review.json)" >>"$GITHUB_OUTPUT"

      - name: Verdict
        id: verdict
        env:
          CVE: ${{ steps.cve.outcome }}
          CODEQL_HIGH: ${{ steps.codeql.outputs.high }}
          AI: ${{ steps.ai.outputs.verdict }}
        run: |
          blocked=false; hold=false
          [[ "$CVE" == success && "${CODEQL_HIGH:-0}" == 0 ]] || blocked=true
          [[ "$AI" == hold ]] && hold=true
          echo "blocked=$blocked" >>"$GITHUB_OUTPUT"
          echo "hold=$hold" >>"$GITHUB_OUTPUT"
          {
            echo "### Security verdict"
            if [[ $blocked == true ]]; then echo "**Blocked**: not publishing tonight; the autofix job will try a fix PR."
            elif [[ $hold == true ]]; then echo "**Held**: publish waits for approval in the release-held environment."
            else echo "Clear to publish."; fi
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security
          path: |
            app/build/security/gate.json
            codeql.json
            review.json
          if-no-files-found: ignore

  smoke:
    name: Alarm smoke test (minified build, emulator)
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_LEVEL: 33
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Signing only has to let the emulator install it, so a throwaway key does; the release key
      # stays in the publish job.
      - name: Throwaway signing key
        run: |
          mkdir -p signing
          keytool -genkeypair -keystore signing/smoke.keystore -storetype PKCS12 -alias smoke \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=smoke" -storepass smoketest -keypass smoketest
          printf 'storeFile=smoke.keystore\nstorePassword=smoketest\nkeyAlias=smoke\nkeyPassword=smoketest\n' >signing/keystore.properties
      - name: Build (release, plus x86_64 for the emulator)
        run: ./gradlew assembleRelease -PsmokeTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: AVD cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-google_apis-x86_64
      - name: Create AVD and snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: Smoke test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: scripts/smoke app/build/outputs/apk/release/app-release.apk

  publish:
    name: Publish
    needs: [check, smoke, security]
    if: needs.check.outputs.skip == 'false' && needs.security.outputs.blocked == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A held night needs a person's approval (release-held has a required reviewer); the job waits
    # there and publishes once approved. Both environments carry the same signing secrets.
    environment: ${{ needs.security.outputs.hold == 'true' && 'release-held' || 'release' }}
    permissions:
      contents: write # create the release and its tag
    env:
      GH_TOKEN: ${{ github.token }}
      N: ${{ needs.check.outputs.n }}
      TAG: ${{ needs.check.outputs.tag }}
      # Release APKs are about 18 MB; a jump past this is a dependency to look at, not ship.
      MAX_APK_BYTES: 31457280
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Same layout as on the release machine: app/build.gradle.kts reads signing/keystore.properties.
      - name: Write the signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          umask 077
          mkdir -p signing
          printf '%s' "$KEYSTORE_B64" | base64 -d >signing/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } >signing/keystore.properties

      - name: Build
        run: ./gradlew assembleRelease

      - name: Check the APK
        env:
          EXPECTED_CERT: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          [[ -n "$EXPECTED_CERT" ]] || { echo "RELEASE_CERT_SHA256 isn't set"; exit 1; }
          cert="$("$tools/apksigner" verify --print-certs "$apk" | awk '/SHA-256 digest/ && !n++ {print $NF}')"
          [[ "$cert" == "$EXPECTED_CERT" ]] || { echo "signed with $cert, expected $EXPECTED_CERT"; exit 1; }
          badging="$("$tools/aapt2" dump badging "$apk")"
          grep -q "package: name='app.daybook' versionCode='$N' versionName='0.$N'" <<<"$badging" \
            || { echo "unexpected package or version:"; head -1 <<<"$badging"; exit 1; }
          grep -q "native-code: 'arm64-v8a'$" <<<"$badging" \
            || { echo "unexpected native code (the emulator ABI must not ship):"; grep native-code <<<"$badging"; exit 1; }
          size="$(stat -c %s "$apk")"
          (( size <= MAX_APK_BYTES )) || { echo "APK is $size bytes, over the $MAX_APK_BYTES limit"; exit 1; }
          # Permissions, exported components, debug flags and cleartext hosts must match the baseline.
          # pipefail: without it the step takes tee's exit status and a failed check still publishes.
          set -o pipefail
          scripts/check-apk "$apk" | tee -a "$GITHUB_STEP_SUMMARY"
          cp "$apk" "diurna-0.$N.apk"
          echo "0.$N: $((size / 1048576)) MB, certificate $cert" >>"$GITHUB_STEP_SUMMARY"

      # What's new entries added since the last published build, in the words the app shows; the
      # PR list GitHub generates follows them.
      - name: Release notes
        run: |
          prev="$(gh release list --limit 50 --json tagName --jq '[.[] | select(.tagName | startswith("v0."))][0].tagName // ""')"
          dir=app/src/main/assets/changelog
          if [[ -n "$prev" ]] && git rev-parse -q --verify "refs/tags/$prev" >/dev/null && [[ -d "$dir" ]]; then
            git diff --name-only --diff-filter=A "$prev" HEAD -- "$dir" | sort -r >new-entries.txt
          else
            : >new-entries.txt
          fi
          {
            if [[ -s new-entries.txt ]]; then
              echo "## What's new"
              while read -r f; do
                [[ -f "$f" ]] || continue
                echo
                echo "**$(head -1 "$f")**"
                echo
                tail -n +2 "$f" | sed '/^$/d' | tr '\n' ' '
                echo
              done <new-entries.txt
            else
              echo "Fixes and improvements."
            fi
            echo
          } >notes.md
          cat notes.md >>"$GITHUB_STEP_SUMMARY"

      - name: Publish
        run: |
          # The exact libraries inside this APK, for anyone checking it against an advisory later.
          ./gradlew -q :app:shippedDependencies
          sed 's/=.*//; /^empty$/d' app/build/security/gradle.lockfile >"diurna-0.$N-dependencies.txt"
          gh release create "$TAG" "diurna-0.$N.apk" "diurna-0.$N-dependencies.txt" --target "$GITHUB_SHA" \
            --title "Diurna 0.$N" --notes-file notes.md --generate-notes
          # Keep the newest 15 builds; Obtainium only needs the latest.
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("v0."))] | sort_by(.createdAt) | reverse | .[15:] | .[].tagName' \
            | while read -r old; do gh release delete "$old" --cleanup-tag --yes; done

      - name: Remove the signing key
        if: always()
        run: rm -rf signing

  autofix:
    name: Security autofix (Claude proposes a fix PR)
    needs: [check, security]
    if: needs.check.outputs.skip == 'false' && needs.security.outputs.blocked == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: security # CLAUDE_AUTOFIX_KEY; main only
    permissions:
      contents: write # push the fix branch
      pull-requests: write # open the PR
      issues: write # or the issue, when there's no safe fix
      actions: write # start Tests on the branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # No token in .git/config: Claude's edits run through Gradle before anything is pushed.
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: security
          path: ${{ runner.temp }}/findings
      # The script keeps the two credentials apart (see its header); neither goes to Claude's checks.
      - name: Ask Claude for a fix, check it, open a PR or an issue
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_AUTOFIX_KEY }}
        run: scripts/security-autofix "$RUNNER_TEMP/findings"
