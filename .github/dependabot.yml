# Version updates, monthly and grouped. Security updates are separate and open right away.
# The cooldown skips releases younger than a week, so a hijacked or broken release has time to be
# pulled before it's proposed.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # A dependency goes to the first group that matches it.
    groups:
      # One PR for the build toolchain and AndroidX: they only work in step. New KSP needs a newer
      # AGP, AGP needs a newer Gradle, and new AndroidX releases need a newer compileSdk (raised by
      # hand in app/build.gradle.kts). Split apart, none of them could pass CI on its own.
      toolchain:
        patterns: ["gradle-wrapper", "org.jetbrains.kotlin*", "com.google.devtools.ksp*", "com.android*", "androidx.*"]
      # R8 keeps the whole SDK (proguard-rules.pro), so its size goes straight into the APK: 2.75
      # added 13 MB. Its own PR, to weigh on its own.
      anthropic:
        patterns: ["com.anthropic*"]
      other:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
